<!DOCTYPE html>
<html>
<head>
    <title>Rondesores</title>
    <meta name="viewport" content="width=device-width, initial-1scale=1.0">
    <style>
        body {
            max-width: 700px;
            margin: 20px auto;
            padding: 15px;
            font-size: 20px;
        }
            
        #chat {
            border: 1px solid #cccccc;
            padding: 15px;
            min-height: 250px;
            margin-bottom: 15px;
            overflow-y: auto;
        }
        #chat p {
            font-size: 23px;
            line-height: 1.55;
            font-weight: 500;
            color: #111111;
        }
        #chat p b {
            font-size: 26px;
            font-weight: 700;
        }
        input {
            width: 70%;
            padding: 10px;
            font-size: 18px;
        }
        button {
            padding: 10px 14px;
            font-size: 16px;
        }
        body.dark-mode {
            background-color: #111111;
            color: white;
        }

        body.dark-mode #chat P {
            color: white;
        }
        
        #natureDecor {
            display: none;
        }

        body.nature-mode #natureDecor {
            display: block;
            font-size: 32px;
            text-align: center;
        }

        body.nature-mode {
            background-image: url("nature-background.png?v=2");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            color: #111111;
            min-height: 100vh;
            max-width: none;

        }
            body.nature-mode #chat P {
                color: #111111;
            }

            body.nature-mode .user-bubble,
            body.nature-mode .ai-bubble {
                max-width: 82%;
                margin-left: auto;
                margin-right: auto;
                box-sizing: border-box;   
        }

        @media (max-width: 480px) {
            body.nature-mode #chat {
                width: calc(100% - 32px);
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
                box-sizing: border-box;
            }
        }
        .user-bubble {
            background-color: white;
            color: #111111;
            padding: 12px 16px;
            border-radius: 16px;
            margin: 10px 0;
        }

        .ai-bubble {
            background-color: #d9efff;
            color: #111111;
            padding: 12px 16px;
            border-radius: 16px;
            margin: 10px 0;
        }

    </style>
</head>
<body>

    <h1>Rondesores</h1>
        <button onclick="setTheme('light')">☀️ Light</button>
        <button onclick="setTheme('dark')">🌙 Dark</button>
        <button onclick="setTheme('nature')">🌿 Nature</button>

    <div id="chat"></div>

    <input id="message" type="text" placeholder="Ask Rondesores anything..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>

    <script>
        function setTheme(theme) {
            document.body.classList.remove("dark-mode", "nature-mode");
            
            if (theme === "dark") {
                document.body.classList.add("dark-mode");
            } else if (theme === "nature") {
                document.body.classList.add("nature-mode");
            }
        }
        
        async function sendMessage(){
            const input = document.getElementById("message");
            const chat = document.getElementById("chat");
            const question = input.value;

        if (!question.trim()) return;

        chat.innerHTML += '<p class="user-bubble"><b>You:</b> ' + question + '</p>';
        input.value = "";

        const response = await  fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify ({
                question: question
            })
        });

            const data = await response.json();

            chat.innerHTML += '<p class="ai-bubble">' + data.answer + '</p>';
            }
            </script>
