<!DOCTYPE html>
<html>
<head>
    <title>Rondesores</title>
    <meta name="viewport" content="width=device-width, initial-1scale=1.0">
    <style>
        body {
            max-width: 700px;
            margin: 20px auto;
            padding: 15px;
            font-size: 20px;
        }
            
        #chat {
            border: 1px solid #cccccc;
            padding: 15px;
            min-height: 250px;
            margin-bottom: 15px;
            overflow-y: auto;
        }
        #chat p {
            font-size: 23px;
            line-height: 1.55;
            font-weight: 500;
            color: #111111;
        }
        #chat p b {
            font-size: 26px;
            font-weight: 700;
        }
        input {
            width: 70%;
            padding: 10px;
            font-size: 18px;
        }
        button {
            padding: 10px 14px;
            font-size: 16px;
        }
        
        body {
            background-color: white;
            color: #111111;
        }

        body.dark-mode {
            background-color: #111111;
            color: white;
        }

        body.dark-mode #chat P {
            color: white;
        }

        body.dark-mode #chat {
            border: none;
        }
        
        body.dark-mode .user-bubble,
        body.dark-mode .ai-bubble {
            background: none !important;
            background-color: transparent !important;
            color: white !important;
            border: none;
            box-shadow: none;

        }

        #natureDecor {
            display: none;
        }

        body.nature-mode {
            background-color: #fffdf7;
            color: #111111;
        }

        body.nature-mode #natureDecor {
            display: block;
            position: fixed;
            inset: 0;
            background-image: url("nature-background.png");
            background-repeat: repeat-y;
            background-position: top center;
            background-size: 100% auto;
            pointer-events: none;
            z-index: 0;
        }

        body.nature-mode h1,
        body.nature-mode button,
        body.nature-mode #chat,
        body.nature-mode #askRow {
            position: relative;
            z-index: 1;
        }

        body.nature-mode #chat {
            border: none;
            width: 100%;
            max-width: 700px;
            min-height: 250px;
            box-sizing: border-box;
        }

        body.nature-mode #chat p {
            color: #111111;
        }

        body.nature-mode .user-bubble {
            max-width: 90%;
            margin: 10px auto;
        }

        body.nature-mode .ai-bubble {
            max-width: 90%;
            margin: 10px auto;
            background-color: #eaf7e8;
        }

        body.nature-mode #askRow {
            width: 100%;
            max-width: 700px;
            margin: 15px auto;
            display: flex;
            gap: 8px;
        }

        body.nature-mode #message {
            flex: 1;
            min-width: 0;
        }

        .user-bubble {
            background-color: white;
            color: #111111;
            padding: 12px 16px;
            border-radius: 16px;
            margin: 10px 0;
        }

        .ai-bubble {
            background-color: #d9efff;
            color: #111111;
            padding: 12px 16px;
            border-radius: 16px;
            margin: 10px 0;
        }

    </style>
</head>
<body>
    <div id="natureDecor"></div>

    <h1>Rondesores</h1>
        <button onclick="setTheme('light')">☀️ Light</button>
        <button onclick="setTheme('dark')">🌙 Dark</button>
        <button onclick="setTheme('nature')">🌿 Nature</button>

    <div id="chat"></div>

    <div id="askRow">
    <input id="message" type="text" placeholder="Ask Rondesores anything...">
    <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        function setTheme(theme) {
            document.body.classList.remove("dark-mode", "nature-mode");
            
            if (theme === "dark") {
                document.body.classList.add("dark-mode");
            } else if (theme === "nature") {
                document.body.classList.add("nature-mode");
            }
        }
        
    document.getElementById("message").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    });    

        async function sendMessage(){
            const input = document.getElementById("message");
            const chat = document.getElementById("chat");
            const question = input.value;

        if (!question.trim()) return;

        chat.innerHTML += '<p class="user-bubble"><b>You:</b> ' + question + '</p>';
        input.value = "";

        const response = await  fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify ({
                question: question
            })
        });

            const data = await response.json();

            chat.innerHTML += '<p class="ai-bubble">' + data.answer + '</p>';
            }
            </script>
